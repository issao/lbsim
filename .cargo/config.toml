# Build coordination for several agents, each in its own git worktree.
#
# Every worktree gets its OWN target directory, relative to this file. An earlier version pointed
# every checkout at one shared absolute directory so cargo's file lock would serialise builds and
# bound memory. That produced wrong builds, observed 2026-09-06: cargo's metadata hash for a path
# crate does not include the workspace path, so two worktrees write identically named rlibs and
# fingerprints into the shared directory, and a worktree whose sources had not changed linked its
# tests against the *other* worktree's freshly built crate. The symptom was a test file on master
# failing to compile against a Scenario struct that only existed on a different branch. A shared
# cache that can hand one branch another branch's artefacts is not a cache; it is a race.
#
# Memory is bounded instead by `jobs`, which caps rustc parallelism per build. This workspace has no
# dependencies and compiles in seconds, so a cold per-worktree build costs little; keep an eye on
# `free -m` when many agents build at once, and run one cargo command at a time per agent.
[build]
target-dir = "target"
jobs = 4

# Warnings are not errors here on purpose. Several agents commit concurrently, and a warning in one
# agent's branch must not break another agent's build the moment master is merged. Clippy at -D
# warnings runs in CI, not in the inner loop.
