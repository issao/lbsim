syntax = "proto3";

package lbsim.v1;

import "lbsim/v1/common.proto";

// KV cache tiering and the shared-prefix tree.
//
// Two separate concerns that share a budget, and the fact that they share it is itself a
// dynamic worth reproducing: under load the prefix cache is squeezed, hit rate falls,
// prefill work rises, and load rises further.

// ---------------------------------------------------------------------------
// Tiering
// ---------------------------------------------------------------------------

// Cluster-pooled DRAM and SSD. Modelled per cluster rather than per host because local
// PCIe (64 GB/s) and remote single-rail RDMA (50 GB/s) are within ~20% of each other, while
// both are ~1000x slower than HBM. Per-host detail would add complexity without changing
// the dynamics. See docs/ARCHITECTURE.md 7.2.
// Tier operations are carried on the Ingress-to-Leaf hop as `TierRequest` and `TierGrant` in
// leaf.proto, because Ingress owns the cluster tiers. There is no separate service: it would be a
// second name for the same round trip.

message StoreRequest {
  uint64 request_id = 1;
  uint64 tokens = 2;
  MemoryTier to_tier = 3;
}
message StoreResponse {
  bool accepted = 1;
  // Set when the tier is full. The caller must then discard and recompute later.
  bool tier_full = 2;
  uint64 transfer_ns = 3;
  uint64 bytes_moved = 4;
}

message FetchRequest { uint64 request_id = 1; MemoryTier from_tier = 2; }
message FetchResponse { bool found = 1; uint64 transfer_ns = 2; uint64 bytes_moved = 3; }

message EvictRequest { uint64 request_id = 1; }
message EvictResponse { uint64 tokens_freed = 1; }

message TierState {
  uint64 cluster_id = 1;
  MemoryTier tier = 2;
  uint64 tokens_resident = 3;
  uint64 tokens_capacity = 4;
  uint64 bandwidth_bytes_per_s = 5;
  // Fraction of bandwidth in use. The signal that makes swap-based preemption stop being
  // cheap. Shared with weight loading, so it is not KV's alone.
  double bandwidth_utilization = 6;
}

// ---------------------------------------------------------------------------
// Shared prefixes
// ---------------------------------------------------------------------------

// A node in the prefix tree. Sharing is *generated by the workload model*, never discovered
// from content, which is what keeps this from becoming a cluster-wide page table: turn N of
// a session extends turn N-1's node, a shared system prompt is a common root, and an agent
// fork creates siblings under a shared parent. Lookup walks ancestors, so it is O(tree
// depth) and independent of prompt length. See docs/ARCHITECTURE.md 7.3.
message PrefixNode {
  uint64 id = 1;
  uint64 parent_id = 2;   // zero for a root
  // Tokens contributed by this node alone. The full prefix length is the sum along the path
  // to the root.
  uint32 tokens = 3;
  // For reporting: how many requests reference this node or its descendants. Reveals whether
  // a scenario's sharing structure is actually as skewed as intended.
  uint64 reference_count = 4;
}

// A replica's answer to "how much of this prompt do you already hold?" This is what a
// router needs; it never needs the content.
message PrefixResidency {
  uint64 replica_id = 1;
  uint64 node_id = 2;
  uint32 resident_tokens = 3;
  uint64 last_used_unix_ns = 4;
}
