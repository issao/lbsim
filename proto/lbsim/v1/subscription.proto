syntax = "proto3";

package lbsim.v1;

import "lbsim/v1/common.proto";

// Metric subscriptions. Shared by both observability hops, Frontend-to-Ingress and
// Ingress-to-Leaf, because the same mechanics apply to both.
//
// Rewritten on Issao's review. Four things changed, and all four made it simpler:
//
//   - Metrics are an enum, not free-text names, so a typo is a compile error.
//   - A subscription names exactly **one** entity. No pagination, no sort keys, no cursors:
//     those were UI concerns leaking into a wire contract. A dashboard showing twelve machines
//     opens twelve subscriptions.
//   - Cadence is a sample rate in points per simulated second, which is what a chart axis
//     actually wants.
//   - The server does what the client asks. It does not derive a coarser rate, cap payload
//     width, or decimate. Bounding the data is the client's job, and every subscription is
//     time-leased, so a badly chosen one expires instead of persisting.
//
// The O(1) property therefore holds by construction rather than by enforcement: one entity per
// subscription means payload width cannot grow with the fleet, and the client chooses the rate.

// ---------------------------------------------------------------------------
// What can be observed
// ---------------------------------------------------------------------------

// Aggregation level. Determines which identifier a Target must carry.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_FLEET = 1;
  SCOPE_CLUSTER = 2;
  SCOPE_POOL = 3;
  SCOPE_TENANT = 4;
  SCOPE_SLO_CLASS = 5;
  SCOPE_REPLICA = 6;
}

// An enum rather than strings, per Issao. A closed set means the client cannot ask for a metric
// that does not exist, the server cannot silently return nothing, and adding one is a schema
// change that both sides see.
//
// Numbering is grouped so related metrics stay adjacent as the set grows: distributions from 1,
// gauges from 20, rates from 40, fleet and cost from 60.
enum Metric {
  METRIC_UNSPECIFIED = 0;

  // -- distributions, reported as percentiles -----------------------------
  METRIC_TTFT = 1;
  METRIC_ITL = 2;
  METRIC_E2E = 3;
  METRIC_QUEUE_WAIT = 4;
  METRIC_PREEMPTED_TIME = 5;
  METRIC_PROMPT_TOKENS = 6;
  METRIC_OUTPUT_TOKENS = 7;
  METRIC_STEP_TIME = 8;

  // -- gauges, time-weighted ----------------------------------------------
  METRIC_KV_UTILIZATION = 20;
  METRIC_KV_TOKENS_RESIDENT = 21;
  METRIC_RUNNING_SEQS = 22;
  METRIC_QUEUED_SEQS = 23;
  METRIC_QUEUED_PREFILL_TOKENS = 24;
  METRIC_BATCH_SIZE = 25;
  METRIC_PREFIX_CACHE_TOKENS = 26;
  // Memory tiers, fleet scope: `values` carries the whole-fleet figure and `distributions` carries
  // one entry per tier, with the tier's id in the percentile slot (1 DRAM, 2 SSD) and the tier's
  // value in the value slot. A tier is not a percentile, and the wire has no per-key map for a row,
  // so the Distribution's parallel arrays are borrowed for a small fixed key set rather than adding a
  // message for two numbers.
  METRIC_TIER_UTILIZATION = 27;
  METRIC_TIER_BANDWIDTH_UTILIZATION = 28;
  METRIC_TELEMETRY_STALENESS = 29;

  // -- rates ---------------------------------------------------------------
  METRIC_OFFERED_RPS = 40;
  METRIC_ADMITTED_RPS = 41;
  METRIC_COMPLETED_RPS = 42;
  METRIC_REJECTED_RPS = 43;
  METRIC_OUTPUT_TOKENS_PER_S = 44;
  // Tokens per second delivered within SLO. The headline number, because a fleet can have
  // excellent throughput and near-zero goodput by making everyone slightly too slow.
  METRIC_GOODPUT_TOKENS_PER_S = 45;
  METRIC_PREEMPTIONS_PER_S = 46;
  METRIC_RETRIES_PER_S = 47;
  METRIC_PREFIX_HIT_RATE = 48;

  // -- fleet and efficiency ------------------------------------------------
  METRIC_READY_REPLICAS = 60;
  METRIC_WARMING_REPLICAS = 61;
  METRIC_DRAINING_REPLICAS = 62;
  METRIC_WARM_IDLE_REPLICAS = 63;
  // Coefficient of variation of per-replica load. The direct measure of whether the load
  // balancer is doing its job.
  METRIC_LOAD_IMBALANCE_CV = 64;
  // GPU-seconds spent on tokens never delivered. Invisible in a utilization metric, and under
  // overload it is most of the fleet's capacity.
  METRIC_WASTED_GPU_FRACTION = 65;
  METRIC_SLO_ATTAINMENT = 66;
  // GPU utilization: the share of the sample window a replica spent inside a step (busy), as
  // opposed to idle with an empty batch. Per replica it is a scalar; at fleet scope it is both the
  // mean (in `values`) and a distribution across replicas (in `distributions`, percentiles over
  // replicas at that instant), because the interesting question is never the average but how many
  // replicas sit idle while others saturate. Issao: "I would like to see gpu utilization in the
  // utilization page, and show percentile graphs for utilization too." Busy is not useful work:
  // `METRIC_WASTED_GPU_FRACTION` says how much of busy time was bandwidth-bound decode at small
  // batch, and `METRIC_GPU_COMPUTE_BOUND_FRACTION` is its complement, the share of busy time the
  // step sat under the compute roofline.
  METRIC_GPU_UTILIZATION = 67;
  METRIC_GPU_COMPUTE_BOUND_FRACTION = 68;
  // A replica's state as the engine knows it, replica scope only: the value is the state's number,
  // 0 ABSENT (a slot the autoscaler has not filled), 1 READY, 2 DEGRADED (slow or hung: true speed
  // below 1), 3 EJECTED (crashed or down), 4 WARMING (turning up, not yet serving), 5 DRAINING
  // (finishing its sequences before it goes). Fleet scope carries the counts in 60-63 instead. Until this existed the dashboard's replica table invented
  // the state column, and Issao read the tag on it as "this run is mock".
  METRIC_REPLICA_STATE = 69;
  // The engine's true speed fraction for a replica, 1.0 healthy, below 1 under gray failure;
  // at fleet scope the mean. What a health-detection policy is trying to observe and a gray
  // failure hides from it.
  METRIC_TRUE_SPEED_MULTIPLIER = 70;
}

// Exactly one entity. Per Issao, selecting a single replica and opening one subscription per
// replica is a better interface than a list plus pagination: the payload cannot grow with the
// fleet, and the client's mental model matches the panel it is drawing.
message Target {
  Scope scope = 1;
  // Required for every scope except SCOPE_FLEET.
  oneof id {
    uint64 cluster_id = 10;
    uint64 pool_id = 11;
    uint64 tenant_id = 12;
    uint64 replica_id = 13;
    SloClass slo_class = 14;
  }
}

// ---------------------------------------------------------------------------
// Opening, renewing, closing
// ---------------------------------------------------------------------------

message OpenSubscriptionRequest {
  string run_id = 1;
  Target target = 2;
  repeated Metric metrics = 3;

  // Points per **simulated** second, per Issao. A chart axis is in simulated time, so this is
  // the number that decides how the chart looks. Fractional values are allowed: 0.1 means one
  // point per ten simulated seconds.
  //
  // Honoured as asked. The server does not derive a coarser rate if the run speeds up. The
  // consequence is that a fine rate at a high simulation speed costs Ingress CPU and therefore
  // wall-clock time; it never affects simulation fidelity, and the lease bounds how long it can
  // last.
  double samples_per_sim_second = 4;

  // Percentiles wanted for any distribution metric, e.g. [50, 90, 99, 99.9]. Empty means count,
  // mean, min and max only.
  repeated double percentiles = 5;

  // Wall-clock lease. The server drops the subscription when it expires, so a closed browser tab
  // cannot leave Ingress and every Leaf shipping data forever. Renew what is still on screen.
  uint64 lease_ns = 6;
}

message OpenSubscriptionResponse {
  string subscription_id = 1;
  // Wall clock, deliberately breaking the `_unix_ns` convention used everywhere else in these
  // interfaces, which denotes a *simulated* instant. A lease governs a real network connection and
  // has nothing to do with simulated time. A client should not compare this to its own clock either,
  // since browser and server clocks disagree; it should count down `lease_ns` locally and treat the
  // renew response's `expired` flag as the only authority. This was previously named `_unix_ns` by an
  // over-eager rename and was, by the project's own convention, a lie.
  uint64 lease_expires_at_wall_ns = 2;
  // Set only on a genuine error: an unset target id for a scope that needs one, an unknown id,
  // or a percentile outside (0, 100]. Never used to override the requested rate.
  string rejected_reason = 3;
}

message RenewSubscriptionRequest { string subscription_id = 1; uint64 lease_ns = 2; }
message RenewSubscriptionResponse { uint64 lease_expires_at_wall_ns = 1; bool expired = 2; }

message CloseSubscriptionRequest { string subscription_id = 1; }
message CloseSubscriptionResponse {}

// ---------------------------------------------------------------------------
// What comes back
// ---------------------------------------------------------------------------

message SubscriptionUpdate {
  string subscription_id = 1;
  // Simulated time this update describes, as an absolute Unix epoch value; see common.proto.
  uint64 sim_time_unix_ns = 2;
  // Realtime factor at the moment of emission, so a client can relate chart movement to
  // wall-clock and see when the run was slowed or paused.
  double realtime_factor = 3;

  MetricRow row = 10;

  // Set on the final update of a run. Issao's preference for interface symmetry: terminal values
  // arrive on the channel the client is already reading rather than as a separate result.
  bool final = 20;
}

message MetricRow {
  Target target = 1;
  // Gauges and rates, keyed by Metric.
  map<int32, double> values = 10;
  // Distribution metrics, keyed by Metric.
  map<int32, Distribution> distributions = 11;
}

// Percentiles, not histograms, on the wire.
//
// Issao suggested computing percentiles at the Leaf because it is cheaper, and he is right where
// it is valid. It is not always valid: percentiles are not mergeable, so a target spanning several
// shards cannot be answered by combining per-shard percentiles. Averaging p99s produces a number
// that is not any percentile of anything.
//
// So the engine does both, and the client never has to care:
//
//   - Target owned by one Leaf, which covers every SCOPE_REPLICA subscription and most
//     SCOPE_POOL ones: the Leaf computes the requested percentiles directly and exactly. Cheap,
//     and nothing but the requested numbers crosses the wire.
//   - Target spanning shards: each Leaf ships its mergeable histogram, Ingress merges and then
//     computes. Correct, at bucket resolution, which for an HDR-style histogram at three
//     significant digits is a tenth of a percent.
//
// `from_merged_histogram` says which happened, because the second case is accurate rather than
// exact and a reader comparing two runs deserves to know.
message Distribution {
  uint64 count = 1;
  double mean = 2;
  double min = 3;
  double max = 4;
  // Parallel arrays: `percentile[i]` is the requested rank, `value[i]` its value. Parallel
  // rather than a map because the client asked in a specific order and charts want it back that
  // way.
  repeated double percentile = 5;
  repeated double value = 6;
  bool from_merged_histogram = 7;

  // Present instead of percentiles on the Leaf-to-Ingress hop when the target spans shards, so
  // Ingress can merge before computing. Never present on the Frontend hop.
  Histogram histogram = 10;
}

// Log-linear bucketed histogram, HDR style. Bounded memory, mergeable by bucket-wise addition,
// and accurate enough in the tail to trust p99.9. Mergeability is the whole point: percentiles are
// not mergeable, so this is what crosses a shard boundary.
message Histogram {
  uint32 significant_digits = 1;
  uint64 lowest_discernible = 2;
  uint64 highest_trackable = 3;
  // Sparse: only non-empty buckets, since most of the range is empty in practice.
  repeated uint32 bucket_index = 10;
  repeated uint64 bucket_count = 11;
}
