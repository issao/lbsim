syntax = "proto3";

package lbsim.v1;

import "lbsim/v1/common.proto";
import "lbsim/v1/request.proto";
import "lbsim/v1/subscription.proto";

// Results of a run.
//
// The scorecard is keyed by the same `Metric` enum the dashboard subscribes to, rather than by
// thirty hand-named fields. A report and a live chart then cannot disagree about what a quantity
// means, and adding a metric is one enum value rather than an edit in three files.

// One scope's results. `values` holds gauges and rates, `distributions` holds latencies.
message Scorecard {
  map<int32, double> values = 1;                 // keyed by Metric
  map<int32, Distribution> distributions = 2;    // keyed by Metric
  map<int32, uint64> outcome_counts = 3;         // keyed by Outcome

  // What the policy claimed it could serve, from Intent.DeclareRatedCapacity. Recorded next to what
  // it actually achieved, because the gap between claim and outcome is the arena's whole score.
  double declared_rated_capacity_rps = 4;
  double declared_rated_capacity_tokens_per_s = 5;

  // Judgements, not quantities. Did the fleet fail to recover after offered load returned to
  // normal? That is the definition of a metastable collapse, and it matters more than any
  // percentile because it is the difference between a bad hour and an outage.
  bool metastable_collapse = 10;
  uint64 recovery_time_ns = 11;
}

message ScopedScorecard {
  Target target = 1;
  Scorecard scorecard = 2;
}

// One sampled request's journey, for reading by a human. Sampling is stratified by latency bucket
// and outcome, because uniform sampling of hundreds of millions of requests contains almost no
// examples of the tail worth reading.
// Which part of the latency distribution a traced request landed in. The sampler stratifies on it so
// the far tail is always represented, and the dashboard asks for "a typical request" or "one from
// the tail" by it.
enum TraceBucket {
  TRACE_BUCKET_UNSPECIFIED = 0;
  TRACE_BUCKET_P50 = 1;   // at or below the median
  TRACE_BUCKET_P90 = 2;   // between the median and p90
  TRACE_BUCKET_P99 = 3;   // between p90 and p99
  TRACE_BUCKET_P999 = 4;  // above p99
}

// Which roofline a step sat under. Decode at small batch is bandwidth-bound, since the weights are
// re-read every step; prefill and large batches are compute-bound. It travels with the span because
// it is the explanation of the span's duration, and re-deriving it from batch size would need the
// cost model on the reader's side.
enum StepBound {
  STEP_BOUND_UNSPECIFIED = 0;
  STEP_BOUND_BANDWIDTH = 1;
  STEP_BOUND_COMPUTE = 2;
}

message RequestTrace {
  RequestRecord record = 1;
  repeated TraceSpan spans = 2;
  TraceBucket bucket = 3;
}

// One span of a sampled request's journey, with what the resource was doing while it ran. Issao:
// "We should have a way to sample requests to see execution traces and what was busy in each resource
// as it executed." The first version carried only concurrency and KV utilization; the fields from 14
// on are the resource state the engine actually knows at the step, so a slow span reads as an
// explanation rather than a mystery. For the gateway and router spans the KV fields are zero, since
// those components hold no cache.
message TraceSpan {
  uint64 start_unix_ns = 1;
  uint64 end_unix_ns = 2;
  string component = 3;    // "gateway", "router", "replica:1234"
  string operation = 4;    // "queue", "route", "prefill", "decode", "kv_fetch", "preempted"
  uint64 replica_id = 5;

  // Sequences in flight on the resource, including those not in this span's step.
  uint32 concurrent_seqs = 10;
  // kv_tokens_resident / kv_capacity, kept for readers that want one number.
  double kv_utilization = 11;
  // Prompt tokens for a prefill chunk, one for a decode step, zero for a wait.
  uint32 tokens_processed = 12;
  MemoryTier kv_tier = 13;

  // The resource while the span ran.
  uint32 batch_size = 14;          // sequences in the step this span was part of
  uint32 queued = 15;              // sequences waiting behind this one
  uint64 kv_tokens_resident = 16;
  uint64 kv_capacity = 17;
  uint64 step_ns = 18;             // the step's duration; for a decode span, the inter-token gap this request saw
  StepBound bound = 19;

  // Routing spans only: which replicas the router looked at and how stale its view of them was.
  // This is what turns a bad routing decision from a statistic into a story.
  repeated uint64 candidates = 20;
  uint64 stale_view_age_ns = 21;
}

message RunResult {
  string run_id = 1;
  // The fully resolved scenario, so any result is reproducible from its own output.
  bytes scenario_serialized = 2;
  uint64 seed = 3;

  // Determinism fingerprint: event count plus a rolling checksum of applied intents. Two runs of
  // the same scenario and seed must match, which makes determinism a test rather than a hope. The
  // same values must also match across shard counts.
  uint64 event_count = 10;
  uint64 state_checksum = 11;

  Scorecard overall = 20;
  repeated ScopedScorecard by_scope = 21;

  // Recorded observability, in the same shape the dashboard streamed. Lets a report be rendered
  // offline and a run be scrubbed without re-simulating.
  repeated SubscriptionUpdate recorded = 30;
  repeated RequestTrace traces = 31;

  // Physics violations the referee clamped in tolerant mode. Any non-zero count invalidates the
  // run's conclusions unless it was expected, so it travels with the data rather than sitting in a
  // log nobody opens.
  map<int32, uint64> referee_violations = 40;   // keyed by RefereeVerdict

  double wall_clock_seconds = 50;
  double realtime_factor = 51;
}
