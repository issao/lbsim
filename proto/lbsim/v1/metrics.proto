syntax = "proto3";

package lbsim.v1;

import "lbsim/v1/common.proto";
import "lbsim/v1/request.proto";
import "lbsim/v1/subscription.proto";

// Results of a run.
//
// The scorecard is keyed by the same `Metric` enum the dashboard subscribes to, rather than by
// thirty hand-named fields. A report and a live chart then cannot disagree about what a quantity
// means, and adding a metric is one enum value rather than an edit in three files.

// One scope's results. `values` holds gauges and rates, `distributions` holds latencies.
message Scorecard {
  map<int32, double> values = 1;                 // keyed by Metric
  map<int32, Distribution> distributions = 2;    // keyed by Metric
  map<int32, uint64> outcome_counts = 3;         // keyed by Outcome

  // Judgements, not quantities. Did the fleet fail to recover after offered load returned to
  // normal? That is the definition of a metastable collapse, and it matters more than any
  // percentile because it is the difference between a bad hour and an outage.
  bool metastable_collapse = 10;
  uint64 recovery_time_ns = 11;
}

message ScopedScorecard {
  Target target = 1;
  Scorecard scorecard = 2;
}

// One sampled request's journey, for reading by a human. Sampling is stratified by latency bucket
// and outcome, because uniform sampling of hundreds of millions of requests contains almost no
// examples of the tail worth reading.
message RequestTrace {
  RequestRecord record = 1;
  repeated TraceSpan spans = 2;
}

message TraceSpan {
  uint64 start_unix_ns = 1;
  uint64 end_unix_ns = 2;
  string component = 3;    // "gateway", "router", "replica:1234"
  string operation = 4;    // "queue", "prefill", "decode", "preempted", "rpc", "kv_migrate"
  uint64 replica_id = 5;

  // Why this span took as long as it did. Without the surrounding conditions a slow span is a
  // mystery rather than an explanation.
  uint32 concurrent_seqs = 10;
  double kv_utilization = 11;
  uint32 tokens_processed = 12;
  MemoryTier kv_tier = 13;
}

message RunResult {
  string run_id = 1;
  // The fully resolved scenario, so any result is reproducible from its own output.
  bytes scenario_serialized = 2;
  uint64 seed = 3;

  // Determinism fingerprint: event count plus a rolling checksum of applied intents. Two runs of
  // the same scenario and seed must match, which makes determinism a test rather than a hope. The
  // same values must also match across shard counts.
  uint64 event_count = 10;
  uint64 state_checksum = 11;

  Scorecard overall = 20;
  repeated ScopedScorecard by_scope = 21;

  // Recorded observability, in the same shape the dashboard streamed. Lets a report be rendered
  // offline and a run be scrubbed without re-simulating.
  repeated SubscriptionUpdate recorded = 30;
  repeated RequestTrace traces = 31;

  // Physics violations the referee clamped in tolerant mode. Any non-zero count invalidates the
  // run's conclusions unless it was expected, so it travels with the data rather than sitting in a
  // log nobody opens.
  map<int32, uint64> referee_violations = 40;   // keyed by RefereeVerdict

  double wall_clock_seconds = 50;
  double realtime_factor = 51;
}
