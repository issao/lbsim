syntax = "proto3";

package lbsim.v1;

import "lbsim/v1/common.proto";
import "lbsim/v1/metrics.proto";
import "lbsim/v1/scenario.proto";
import "lbsim/v1/workload.proto";
import "lbsim/v1/subscription.proto";

// The Frontend-to-Ingress API. Served for real over gRPC and grpc-web; everything in
// serving.proto is modelled instead.
//
// Every call is O(1) in payload: run lifecycle, speed, a bounded step, rewind, and subscription
// management. Metric flow is bounded because a subscription names exactly one entity; see
// subscription.proto.
//
// Trimmed on review. Deliberately absent, each recoverable without a schema change: comparing two
// runs, which a client does by fetching both results; report export, which the CLI does; the
// showcase scenario catalogue and its narration steps, which are content rather than interface;
// and a policy-descriptor endpoint for building UI controls from the server, which is a
// convenience the dashboard can live without until it exists.

service Ingress {
  // -- lifecycle ----------------------------------------------------------
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc StopRun(RunRef) returns (RunStatus);
  rpc GetRun(RunRef) returns (RunStatus);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);

  // -- interactive control ------------------------------------------------

  // Pace the run at a fixed number of simulated seconds per wall-clock second, so a dynamic can be
  // watched unfolding, or pause it.
  rpc SetSpeed(SetSpeedRequest) returns (RunStatus);

  // Advance a bounded amount and pause. Bounded so the request stays O(1) however much simulated
  // time it asks for: a large request returns after its cap and is repeated.
  rpc StepForward(StepForwardRequest) returns (RunStatus);

  // Scrub. Cheap when only the view changed, since it reads the recorded observability log and
  // needs no re-simulation. Expensive when a physics parameter changed, since it restores a
  // snapshot and re-simulates. The response says which, so the interface never implies a
  // continuity that does not exist.
  rpc Rewind(RewindRequest) returns (RewindResponse);

  // Change load or policy mid-run: the two live-tunable control-panel tabs in docs/ui-spec.md.
  //
  // Typed rather than a map of dotted paths. Issao asked where load and policy configuration lived,
  // which was a fair question: they were one level down inside Scenario, and an untyped
  // `map<string,string>` of paths was the only way to change them on a running simulation. A UI
  // cannot build controls from that, and a typo in a path is a runtime surprise instead of a
  // compile error.
  //
  // Fleet shape has no equivalent call on purpose. Changing cluster or pool topology mid-run
  // invalidates every replica's state, so it is a new run rather than an update, and saying so is
  // more honest than a call that silently restarts everything.
  rpc UpdateWorkload(UpdateWorkloadRequest) returns (UpdateResponse);
  rpc UpdatePolicies(UpdatePoliciesRequest) returns (UpdateResponse);

  // -- observation --------------------------------------------------------
  rpc OpenSubscription(OpenSubscriptionRequest) returns (stream SubscriptionUpdate);
  rpc RenewSubscription(RenewSubscriptionRequest) returns (RenewSubscriptionResponse);
  rpc CloseSubscription(CloseSubscriptionRequest) returns (CloseSubscriptionResponse);

  // -- results ------------------------------------------------------------
  rpc GetResult(RunRef) returns (RunResult);
  rpc GetTraces(GetTracesRequest) returns (GetTracesResponse);
}

message RunRef { string run_id = 1; }

message StartRunRequest {
  // Everything a run needs, including `workload` as a LoadShape from workload.proto and `policies`
  // as a PolicySpec. Both live inside Scenario rather than beside it, so one message fully
  // determines a run and can be recorded with its results and replayed.
  Scenario scenario = 1;
  // Cap on simulated seconds per wall-clock second. Unset means as fast as possible.
  double max_realtime_factor = 2;
  bool record_traces = 3;

message RunStatus {
  string run_id = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_QUEUED = 1;
    STATE_RUNNING = 2;
    STATE_PAUSED = 3;
    STATE_COMPLETE = 4;
    STATE_FAILED = 5;
  }
  State state = 2;
  uint64 sim_time_unix_ns = 3;
  uint64 sim_end_unix_ns = 4;
  double realtime_factor = 5;
  string error = 6;
}

message ListRunsRequest { uint32 limit = 1; string cursor = 2; }
message ListRunsResponse { repeated RunStatus runs = 1; string next_cursor = 2; }

message SetSpeedRequest {
  string run_id = 1;
  // Simulated seconds per wall-clock second. Zero or unset means as fast as possible.
  double realtime_factor = 2;
  bool paused = 3;
}

message StepForwardRequest {
  string run_id = 1;
  // Exactly one. Both are capped server-side so the call stays bounded; RunStatus shows where it
  // stopped, and the client repeats to continue.
  uint64 sim_duration_ns = 2;
  uint32 barrier_windows = 3;
}

message RewindRequest { string run_id = 1; uint64 to_sim_time_unix_ns = 2; }
message RewindResponse {
  uint64 sim_time_unix_ns = 1;
  // True when served from the recorded log with no re-simulation. False means a snapshot was
  // restored and time re-simulated, which is slower and, if a physics parameter changed since,
  // produces a different future than the one already shown.
  bool from_log = 2;
  uint64 restored_from_snapshot_unix_ns = 3;
}

message UpdateWorkloadRequest {
  string run_id = 1;
  // The complete replacement shape. Whole rather than a patch, because a partial workload update
  // has no well-defined meaning: arrival rate, length distribution and prefix topology interact,
  // and applying half of a change would produce a load nobody asked for.
  LoadShape workload = 2;
}

message UpdatePoliciesRequest {
  string run_id = 1;
  PolicySpec policies = 2;
}

message UpdateResponse {
  bool accepted = 1;
  // True when the change altered physics, so the run was rewound to a snapshot and re-simulated.
  // The UI must show this rather than implying a continuity that does not exist: a chart that
  // silently recomputed its own history while claiming to be live is worse than one that pauses to
  // say so.
  bool required_resimulation = 2;
  uint64 rewound_to_unix_ns = 3;
  string rejected_reason = 4;
}

message GetTracesRequest {
  string run_id = 1;
  // Filters, so a client can ask for exactly the interesting tail rather than sampling again.
  Outcome outcome = 2;
  uint64 min_e2e_ns = 3;
  uint64 tenant_id = 4;
  uint32 limit = 5;
}
message GetTracesResponse { repeated RequestTrace traces = 1; }
