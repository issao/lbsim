syntax = "proto3";

package lbsim.v1;

import "lbsim/v1/workload.proto";

// A complete, reproducible experiment definition.
//
// This message is the canonical schema. Humans author scenarios in TOML, which is parsed
// into it; the dashboard edits it directly. A run records the fully resolved Scenario
// alongside its results, so any result can be reproduced from its own output.
//
// Reference values for the hardware and model fields are in
// docs/llm-serving-primer.md section 10.7.

message Scenario {
  string name = 1;
  string description = 2;

  // The single seed everything derives from. Named sub-streams are hashed from it, so
  // changing the arrival rate does not perturb prompt lengths and enabling failure injection
  // does not perturb the workload. Without that independence an A/B comparison silently
  // compares two different workloads.
  uint64 seed = 3;

  uint64 duration_ns = 4;
  // Excluded from all reported statistics, so a run measures steady state rather than the
  // transient of an empty fleet filling up.
  uint64 warmup_ns = 5;

  repeated ModelSpec models = 10;
  repeated AcceleratorSpec accelerators = 11;
  repeated ClusterSpec clusters = 12;
  // Defined once, in workload.proto. An earlier draft duplicated the whole workload description
  // here, which meant two places to change and two chances to disagree.
  LoadShape workload = 13;
  PolicySpec policies = 14;
  TelemetrySpec telemetry = 15;
  FailureSpec failures = 16;
  FidelitySpec fidelity = 17;
  ObservabilitySpec observability = 18;
}

// ---------------------------------------------------------------------------
// Hardware and model
// ---------------------------------------------------------------------------

message AcceleratorSpec {
  string name = 1;                     // "h100-sxm-80"
  uint64 hbm_bytes = 2;
  uint64 hbm_bandwidth_bytes_per_s = 3;
  // Dense, without sparsity, which is what inference actually achieves.
  double peak_dense_flops_bf16 = 4;
  double peak_dense_flops_fp8 = 5;
  // Unidirectional, per GPU.
  uint64 nvlink_bytes_per_s = 6;
}

message ModelSpec {
  uint32 id = 1;
  string name = 2;
  uint64 n_params = 3;
  uint32 n_layers = 4;
  // Grouped-query attention: KV heads, not attention heads. Using the wrong one misstates
  // KV size by up to 8x, which would invalidate every capacity conclusion.
  uint32 n_kv_heads = 5;
  uint32 head_dim = 6;
  uint32 dtype_bytes = 7;
  // Derived as 2 * layers * kv_heads * head_dim * dtype_bytes. Stated explicitly so a
  // scenario can override it for a model with an unusual attention variant, and checked
  // against the derivation at load time.
  uint64 kv_bytes_per_token = 8;
  uint64 weight_bytes = 9;
}

message ReplicaSpec {
  string accelerator = 1;
  uint32 model_id = 2;
  // Tensor-parallel degree. Also the failure domain: one GPU fault kills the whole replica
  // and every request in flight on it.
  uint32 tensor_parallel = 3;
  uint32 pipeline_parallel = 4;

  // -- engine efficiency, the calibration surface -------------------------

  // Memory-bandwidth utilization during decode. 0.60-0.85 realistic.
  double mbu_decode = 10;
  // Model-FLOPS utilization during prefill. 0.35-0.60 realistic.
  double mfu_prefill = 11;
  // Fixed per-step cost: kernel launch, sampling, scheduler. Dominates at low batch, where
  // measured decode is 2-3x the roofline prediction. Calibrate this first; it anchors
  // everything else.
  uint64 fixed_step_overhead_ns = 12;
  // Per-layer tensor-parallel all-reduce cost, which is why more GPUs is not linearly better.
  uint64 tp_collective_ns_per_layer = 13;

  // -- capacity ----------------------------------------------------------

  uint64 kv_capacity_tokens = 20;
  uint32 kv_block_tokens = 21;         // 16 in vLLM; makes allocation granular
  uint32 max_num_seqs = 22;
  // Chunked prefill budget. Bounds the inter-token stall a long prompt inflicts on everyone
  // already decoding: a 32k prompt at an 8k budget becomes four smaller stalls instead of
  // one two-second one.
  uint32 max_batched_tokens_per_step = 23;
  // Ceiling on the prefix cache, so it cannot consume the KV budget entirely.
  uint64 prefix_cache_max_tokens = 24;
  uint32 prefix_cache_max_nodes = 25;

  // -- lifecycle ---------------------------------------------------------

  uint64 cold_start_warm_node_ns = 30;
  uint64 cold_start_cold_node_ns = 31;
  double cold_start_jitter_cv = 32;
}

// ---------------------------------------------------------------------------
// Topology
// ---------------------------------------------------------------------------

message ClusterSpec {
  uint64 id = 1;
  string name = 2;
  // Drives the diurnal phase offset of this cluster's traffic. Multi-geo diurnal patterns
  // are what make global autoscaling interesting: capacity can follow the sun.
  string region = 3;
  double utc_offset_hours = 4;

  repeated PoolSpec pools = 10;

  // Cluster-pooled memory tiers.
  uint64 dram_tier_bytes = 20;
  uint64 dram_tier_bandwidth_bytes_per_s = 21;
  uint64 ssd_tier_bytes = 22;
  uint64 ssd_tier_bandwidth_bytes_per_s = 23;
  // Aggregate RDMA, shared between KV movement, weight loading and control traffic. Sharing
  // it is what makes prefill/decode disaggregation stop being free under load.
  uint64 rdma_bytes_per_s = 24;

  // -- modelled call latencies -------------------------------------------

  LatencySpec gateway_to_router = 30;
  LatencySpec router_to_replica = 31;
  LatencySpec intra_cluster = 32;
  // To every other cluster. 10-100 ms, and also the safe lookahead that lets each cluster
  // run on its own thread deterministically.
  map<uint64, LatencySpec> to_cluster = 33;

  uint32 router_instances = 40;
  // More routers sharing one stale snapshot means a bigger stampede onto whichever replica
  // last looked idle. This field is the herding knob.
  uint32 gateway_instances = 41;
}

message PoolSpec {
  uint64 id = 1;
  string name = 2;
  ReplicaSpec replica = 3;
  uint32 initial_replicas = 4;
  uint32 min_replicas = 5;
  uint32 max_replicas = 6;
  uint32 warm_idle_replicas = 7;
  // For prefill/decode disaggregation: a pool may serve only one phase.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_BOTH = 1;
    ROLE_PREFILL_ONLY = 2;
    ROLE_DECODE_ONLY = 3;
  }
  Role role = 8;
}

message LatencySpec {
  uint64 median_ns = 1;
  double cv = 2;             // lognormal spread
  double loss_probability = 3;
  uint64 timeout_ns = 4;
}

// ---------------------------------------------------------------------------
// Policies
// ---------------------------------------------------------------------------

// Which policy fills each slot, and its parameters, typed.
//
// Requested by Issao: *"Don't make these string, model them explicitly as protos please so that I
// can see the schema."* An earlier version was a policy name plus `map<string, double>`, which hid every
// parameter: you could not tell from the schema what a policy accepted, a typo in a key was silent,
// and a UI had no way to build controls without a separate descriptor endpoint.
//
// The cost of typing them is that adding a policy is now a schema change. That is the right trade
// here: the arena tunes parameters of policies that ship rather than inventing new ones, per
// docs/arena.md section 6, and a visible schema is worth more than open extensibility to a project
// whose whole purpose is comparing named policies. It also removed the need for a policy-descriptor
// endpoint, because the schema *is* the descriptor.
message PolicySpec {
  RoutingPolicy routing = 1;
  AdmissionPolicy admission = 2;
  SchedulingPolicy replica_scheduling = 3;
  PreemptionPolicy preemption = 4;
  AutoscalingPolicy autoscaling = 5;
  FailureDetectionPolicy failure_detection = 6;
  KvTieringPolicy kv_tiering = 7;
  // Speculative decoding is configured in FidelitySpec, not here, since it is a property of the
  // engine rather than a decision made per request.

  // strict aborts the run on any physics violation, which is what the arena uses so a cheating
  // policy cannot score. tolerant clamps and counts.
  enum RefereeMode {
    REFEREE_MODE_UNSPECIFIED = 0;
    REFEREE_MODE_STRICT = 1;
    REFEREE_MODE_TOLERANT = 2;
  }
  RefereeMode referee_mode = 20;
}

// A policy the arena wrote as code, rather than one that shipped. Per the user: the policy generator
// has "full power to write code to write new policies, as well as tuning parameters on existing
// policies." The mechanism is that the arena writes a Rust source file into the policies crate,
// builds, and runs; this message is how a scenario names it and how a run stays reproducible.
//
// `source_sha256` is load-bearing. A generated policy can be regenerated differently under the same
// name, and a result that cannot say exactly which code produced it is not a result.
message GeneratedPolicy {
  string name = 1;
  string source_sha256 = 2;
  // Path relative to the repository root, so the source can be found and the hash checked.
  string source_path = 3;
}

// Where to send a request. The measured constraint from docs/ARCHITECTURE.md section 10.4 applies
// to every option here: a decision must be O(1) or O(log N), never a scan of the fleet.
message RoutingPolicy {
  message RoundRobin {}
  message Random {}
  // Fewest in-flight requests. Included as a baseline that is *wrong* for this domain, since
  // capacity is denominated in tokens: one 100k-token context costs what 25 chat turns cost.
  message LeastRequests {}
  // Fewest resident KV tokens: the same idea measured in the right unit.
  message LeastKvTokens {}
  // Sample `choices` replicas at random, take the least loaded. Robust to stale telemetry because
  // only a fraction of routers consider any one apparently-idle replica at a time, which is what
  // bounds herding. Also O(1) by construction.
  message PowerOfTwoChoices {
    uint32 choices = 1;          // d; 2 is where almost all the benefit lives
    // Pay a modelled probe for fresh state instead of reading the delayed snapshot. Makes the cost
    // of freshness visible rather than free.
    bool probe_live = 2;
  }
  // Prefer the replica already holding this request's prefix, until imbalance exceeds the cap.
  // Weighted random over the fleet's stale view: each replica's weight is the linear function
  // c1 + c2·has_queued_decode + c3·has_queued_prefill + c4·queued_decode_beyond_open_buffer +
  // c5·queued_prefill_beyond_open_buffer, clamped at zero, and the router samples proportionally.
  // "Beyond the open buffer" is the work the replica's scheduler cannot fit into the batch it is
  // currently collecting (see SchedulingPolicy.BufferedBatch), which is the part that will wait a
  // whole buffer cycle. Negative c2..c5 steer away from queues; c1 alone is Random. Issao: "we should
  // create a weighed random policy where the weight for any given node is a linear function of
  // C_1 + C_2*has_queue_decode + C_3*has_queued_prefill + C_4*queued_decode_beyond_current_open_buffer
  // + C_5*queued_prefill_beyond_current_open_buffer."
  message WeightedRandom {
    double c1 = 1;
    double c2_has_queued_decode = 2;
    double c3_has_queued_prefill = 3;
    double c4_queued_decode_beyond_open_buffer = 4;
    double c5_queued_prefill_beyond_open_buffer = 5;
  }
  message PrefixAffinity {
    // Yield to load when the candidate's load exceeds the fleet mean by this ratio. 1.0 disables
    // affinity entirely; a large value ignores load and produces hotspots.
    double max_load_ratio = 1;
    // Fall back to sampling this many candidates when affinity is refused.
    uint32 fallback_choices = 2;
  }
  oneof kind {
    RoundRobin round_robin = 10;
    Random random = 11;
    LeastRequests least_requests = 12;
    LeastKvTokens least_kv_tokens = 13;
    PowerOfTwoChoices power_of_two_choices = 14;
    PrefixAffinity prefix_affinity = 15;
    WeightedRandom weighted_random = 16;
    GeneratedPolicy generated = 99;
  }
}

// Whether to accept a request at all. Rate limits are denominated in tokens, never requests.
message AdmissionPolicy {
  message AcceptAll {}
  message TokenBucket {
    double tokens_per_second = 1;
    double burst_tokens = 2;
    // Charged at admission against max_output_tokens and refunded on completion, because the true
    // output length is unknown. The gap between the charge and reality is where preemption is born.
    bool charge_max_tokens = 3;
  }
  // Shed anything that cannot meet its deadline, *before* it consumes GPU time. Systems that check
  // afterwards spend most of their capacity under overload producing tokens nobody will read.
  message DeadlineAware {
    double queue_wait_headroom = 1;   // fraction of the deadline reserved for serving
  }
  // Weighted fair share over tenants, in tokens.
  message FairShare {
    double burst_multiplier = 1;
  }
  oneof kind {
    AcceptAll accept_all = 10;
    TokenBucket token_bucket = 11;
    DeadlineAware deadline_aware = 12;
    FairShare fair_share = 13;
    GeneratedPolicy generated = 99;
  }
}

// What the replica does each step: which queued requests to admit and how to split the step budget
// between prefill and decode. This is where the utilization-versus-latency tradeoff lives.
message SchedulingPolicy {
  message Fcfs {}
  // Favour prefill: better time-to-first-token, worse inter-token latency for everyone already
  // decoding, and faster KV growth because admission accelerates.
  message PrefillPriority {
    uint32 max_prefill_tokens_per_step = 1;
  }
  // Favour decode: the reverse, and it can starve arrivals.
  message DecodePriority {
    uint32 min_decode_tokens_per_step = 1;
  }
  // Earliest deadline first over the queue.
  message EarliestDeadlineFirst {}
  // Interactive classes before batch ones, and batch sequences are the first preemption victims;
  // the scheduling half of the SLO classes. The classes themselves are `Workload.slo_classes`.
  message ClassPriority {}
  // A batch buffer at the GPU scheduler: the replica collects prefill and decode work into the next
  // step's batch until the buffer is full or its oldest entry has waited max_hold_ms, then steps.
  // Capacity is bounded three ways: sequences (max_batch, at most the replica's batch limit), prefill
  // tokens per step (max_prefill_tokens) and decode sequences per step (max_decode_seqs), and always
  // by the step's bandwidth line (the KV the step must read fits the cost model's HBM budget). Issao:
  // "a buffer for collecting multiple prefill/decode requests in a single batch within available hbm
  // bandwidth ... sized at up to the batch size (and max prefill and decode capacity per buffer
  // tunable) as well as have a time parameter that keeps a buffer around for at most n milliseconds."
  message BufferedBatch {
    uint32 max_batch = 1;
    uint32 max_prefill_tokens = 2;
    uint32 max_decode_seqs = 3;
    double max_hold_ms = 4;
  }
  oneof kind {
    Fcfs fcfs = 10;
    PrefillPriority prefill_priority = 11;
    DecodePriority decode_priority = 12;
    EarliestDeadlineFirst earliest_deadline_first = 13;
    ClassPriority class_priority = 14;
    BufferedBatch buffered_batch = 15;
    GeneratedPolicy generated = 99;
  }
}

// What to evict when KV fills, and where its state goes. Swap costs roughly 20 ms each way to
// cluster DRAM; recompute costs roughly 270 ms of prefill for 4k tokens, so swap wins until the
// shared bandwidth saturates and the advantage inverts.
message PreemptionPolicy {
  message Never {}
  message Recompute { Victim victim = 1; }
  message SwapToDram { Victim victim = 1; }
  message SwapToDramElseRecompute { Victim victim = 1; }
  enum Victim {
    VICTIM_UNSPECIFIED = 0;
    VICTIM_NEWEST = 1;              // least work lost
    VICTIM_LARGEST_KV = 2;          // frees the most, fastest
    VICTIM_LOWEST_SLO_CLASS = 3;    // batch traffic exists to be preempted
    VICTIM_LATEST_DEADLINE = 4;
  }
  oneof kind {
    Never never = 10;
    Recompute recompute = 11;
    SwapToDram swap_to_dram = 12;
    SwapToDramElseRecompute swap_else_recompute = 13;
    GeneratedPolicy generated = 99;
  }
}

// When to change fleet size. The actuator delay is a cold start of 30 to 300 seconds against a
// burst that develops in tens of seconds, which is why reactive scaling cannot catch one.
message AutoscalingPolicy {
  message Fixed {}
  message ReactiveThreshold {
    // Scale on queue depth or KV utilization, never on GPU utilization: a decode-bound replica
    // reports high utilization across a wide range of actual load.
    double scale_up_above = 1;
    double scale_down_below = 2;
    uint64 cooldown_ns = 3;
    uint32 step_replicas = 4;
  }
  // Follow a learned or configured diurnal curve, acting ahead of demand by the cold-start time.
  message PredictiveDiurnal {
    uint64 lookahead_ns = 1;
    double headroom_fraction = 2;
  }
  // Hold loaded-but-idle replicas. The only thing that makes scaling fast enough to matter, and it
  // costs money to hold, so the size is a genuine tradeoff rather than a free win.
  message WarmPool {
    uint32 warm_replicas = 1;
    double scale_up_above = 2;
  }
  oneof kind {
    Fixed fixed = 10;
    ReactiveThreshold reactive_threshold = 11;
    PredictiveDiurnal predictive_diurnal = 12;
    WarmPool warm_pool = 13;
    GeneratedPolicy generated = 99;
  }
}

// How to notice a replica that is failing without saying so. Detection latency is the property
// under test, since a replica reporting healthy while serving at a tenth of its speed keeps
// receiving work.
message FailureDetectionPolicy {
  message TrustAnnounced {}
  message LatencyOutlier {
    // Eject when a replica's observed latency exceeds the fleet median by this factor for the
    // window below.
    double median_multiple = 1;
    uint64 window_ns = 2;
    uint64 reinstate_after_ns = 3;
  }
  message SilenceTimeout {
    uint64 silent_for_ns = 1;
  }
  oneof kind {
    TrustAnnounced trust_announced = 10;
    LatencyOutlier latency_outlier = 11;
    SilenceTimeout silence_timeout = 12;
    GeneratedPolicy generated = 99;
  }
}

// Where preempted KV and cached prefixes go. Tier capacities and bandwidths are in ClusterSpec.
message KvTieringPolicy {
  message DiscardOnly {}
  message DramThenDiscard { double dram_reserve_fraction = 1; }
  message DramThenSsd {
    double dram_reserve_fraction = 1;
    // Below this remaining SSD fraction, stop spilling rather than thrash.
    double ssd_stop_below = 2;
  }
  oneof kind {
    DiscardOnly discard_only = 10;
    DramThenDiscard dram_then_discard = 11;
    DramThenSsd dram_then_ssd = 12;
    GeneratedPolicy generated = 99;
  }
}

// ---------------------------------------------------------------------------
// Telemetry, failures, fidelity, observability
// ---------------------------------------------------------------------------

message TelemetrySpec {
  // The sensor period. With the propagation delay below, these two numbers plus the cold
  // start time are the whole reason control-theoretic instability appears.
  uint64 publish_interval_ns = 1;
  double publish_jitter = 2;
  LatencySpec propagation = 3;
  // How long before a consumer treats a silent replica as unknown. How a policy handles
  // "unknown" matters greatly, and absence of data is not evidence of failure.
  uint64 staleness_timeout_ns = 4;
  // Allow policies to pay for a fresh probe instead of waiting. Needed to compare
  // probe-based power-of-two-choices against scrape-based least-loaded honestly.
  bool allow_probes = 5;
  uint64 probe_cost_ns = 6;
}

message FailureSpec {
  repeated FailureEvent events = 1;
  // Background rates, so the fleet is never perfectly healthy, which is the realistic case.
  double replica_mtbf_hours = 10;
  double gray_failure_probability = 11;
}

message FailureEvent {
  uint64 at_offset_ns = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_REPLICA_CRASH = 1;         // announced, in-flight requests lost
    KIND_REPLICA_GRAY_SLOWDOWN = 2; // reports healthy, serves at a fraction of speed
    KIND_REPLICA_STALL = 3;         // accepts work, never completes it
    KIND_TELEMETRY_FREEZE = 4;      // keeps publishing stale values
    KIND_CLUSTER_PARTITION = 5;
    KIND_ZONE_LOSS = 6;             // lose a fraction of a cluster at once
    KIND_LOAD_SPIKE = 7;
    KIND_CAPACITY_UNAVAILABLE = 8;  // autoscaling requests start failing
  }
  Kind kind = 2;
  repeated uint64 replica_ids = 3;
  uint64 cluster_id = 4;
  double fraction = 5;
  uint64 duration_ns = 6;
  double magnitude = 7;
}

message FidelitySpec {
  // How often policies are consulted. This, not request aggregation, is the honest fidelity
  // dial: even every_step costs only ~1.4x, because 40 steps/s is small next to ~100
  // composition changes/s. See docs/ARCHITECTURE.md 3.4.
  enum DecisionInterval {
    DECISION_INTERVAL_UNSPECIFIED = 0;
    DECISION_INTERVAL_ON_CHANGE = 1;
    DECISION_INTERVAL_EVERY_N_MS = 2;
    DECISION_INTERVAL_EVERY_N_STEPS = 3;
    DECISION_INTERVAL_EVERY_STEP = 4;
  }
  DecisionInterval decision_interval = 1;
  uint32 decision_interval_value = 2;

  // Turn decode off to make traffic behave like stateless serving. Needed for the
  // round-robin rolling-hotspot demonstration, which requires no LLM-specific modelling at
  // all and is therefore the right first scenario.
  bool disable_decode = 10;
  bool disable_prefix_cache = 11;
  bool disable_preemption = 12;

  // Clusters simulated as aggregate flow rather than individual requests. Use for regions
  // outside the focus of an experiment, so they still create realistic cross-region pressure
  // at ~1% of the cost. Never for the cluster under study: aggregation averages away the
  // heterogeneity that causes hotspots and tail latency.
  repeated uint64 fluid_cluster_ids = 20;

  // Speculative decoding, modelled as Issao specified: propose N draft tokens per step, accept M on
  // average, both drawn per request at Ingress and constant for that request so the closed form
  // holds. Zero draft_tokens disables it.
  //
  // The erosion of speedup at large batch is emergent rather than configured: verification
  // multiplies the compute term by N while leaving weight reads alone, so once the compute branch
  // of the cost model dominates, the gain disappears on its own.
  uint32 spec_draft_tokens = 30;          // N, e.g. 5
  double spec_accepted_tokens = 31;       // M, e.g. 3.0
  double spec_accepted_cv = 32;           // 0 for a fixed M; above 0 draws per request
}

message ObservabilitySpec {
  // Live sampling rates are chosen per subscription, not here; see subscription.proto. What a run
  // must decide up front is what it *records*, since that cannot be reconstructed later.
  uint64 record_interval_ns = 1;

  // A simulated hour completes hundreds of millions of requests, so full records exist only for
  // samples. Uniform sampling contains almost no examples above the 99.9th percentile, which are
  // the ones worth reading, so it is stratified by latency bucket and by outcome.
  double trace_sample_rate = 10;
  uint32 traces_per_latency_bucket = 11;
  uint32 traces_per_outcome = 12;

  // Coarse snapshots bound how much must be re-simulated when a parameter changes mid-run.
  // Scrubbing reads the recorded log instead and needs none.
  uint64 snapshot_interval_ns = 20;
}
