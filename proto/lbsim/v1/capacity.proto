syntax = "proto3";

package lbsim.v1;

import "lbsim/v1/common.proto";

// Fleet lifecycle: the actuator whose delay dominates autoscaling behaviour.
//
// Adding a replica takes 30-300 seconds because tens to hundreds of gigabytes of weights
// must be read and loaded, and warmup follows. A traffic burst develops in tens of seconds.
// So this interface is where the fundamental impossibility of reactive scaling lives.
// See docs/llm-serving-primer.md section 7.

service CapacityManager {
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
  // Stop routing new work and wait for in-flight requests. Draining can take minutes when
  // generations are long, and the replica's prefix cache is lost, so remaining replicas see
  // a hit-rate drop exactly when capacity was removed.
  rpc Drain(DrainRequest) returns (DrainResponse);
  rpc Terminate(TerminateRequest) returns (TerminateResponse);
  rpc GetPoolState(GetPoolStateRequest) returns (PoolState);
}

message ProvisionRequest {
  PoolId pool = 1;
  uint32 count = 2;
  // Take from the warm pool if available, which is the only thing that makes scaling fast
  // enough to matter. Warm replicas cost money to hold idle, so pool sizing is a real
  // tradeoff rather than a free win.
  bool prefer_warm = 3;
}

message ProvisionResponse {
  repeated ReplicaId replicas = 1;
  // Expected time until serving. Broken out so a scenario can show which stage dominates.
  uint64 estimated_ready_at_unix_ns = 2;
  uint64 node_wait_ns = 3;      // scheduling or provisioning a GPU node
  uint64 image_pull_ns = 4;
  uint64 weight_load_ns = 5;    // usually the largest term
  uint64 warmup_ns = 6;         // CUDA graph capture, autotune
  // Set when the pool cannot grow: no quota, no capacity in the zone. Real clusters hit
  // this, and a policy that assumes scaling always succeeds fails badly when it does not.
  bool capacity_unavailable = 7;
}

message DrainRequest { ReplicaId replica = 1; uint64 max_wait_ns = 2; }
message DrainResponse {
  uint64 drained_at_unix_ns = 1;
  // Requests still running when max_wait_ns expired and were killed. Nonzero here is a
  // scale-down policy failing its users.
  uint32 requests_abandoned = 2;
  uint64 prefix_cache_tokens_lost = 3;
}

message TerminateRequest { ReplicaId replica = 1; }
message TerminateResponse { uint64 terminated_at_unix_ns = 1; }

message GetPoolStateRequest { PoolId pool = 1; }

message PoolState {
  PoolId pool = 1;
  ClusterId cluster = 2;
  uint32 model_id = 3;
  uint32 gpus_per_replica = 4;

  uint32 ready = 10;
  uint32 warming = 11;
  uint32 draining = 12;
  uint32 warm_idle = 13;   // loaded and held in reserve
  uint32 max_replicas = 14;

  // Set when the last Provision was refused. A policy should back off rather than retry
  // into a wall.
  bool at_quota = 20;
}
