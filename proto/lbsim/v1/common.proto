syntax = "proto3";

package lbsim.v1;

// Shared enums and the time convention.
//
// Identifiers are plain `uint64` fields named `<thing>_id`, not wrapper messages. Wrappers cost
// an allocation and a level of indirection per id for no type safety that proto itself enforces;
// the generated Rust newtypes them instead. Human-readable names live in the scenario and are
// resolved to ids once at load time.

// ---------------------------------------------------------------------------
// Time
// ---------------------------------------------------------------------------
//
// **Simulated time is absolute Unix epoch nanoseconds in a uint64**, per Issao, not an offset
// from the start of a run. The origin is derived from the scenario seed, so a run stays
// reproducible while its timestamps format like real ones and a diurnal workload lands on real
// times of day. It also makes a simulated trace directly comparable against a recorded one.
//
// Two consequences, both load-bearing:
//
//   - **No simulated timestamp may pass through a float.** 2026 is about 1.79e18 ns since the
//     epoch, and a float64 has a 53-bit mantissa, so it resolves only about 200 ns at that
//     magnitude. Absolute epoch time makes uint64 mandatory rather than merely preferable.
//     Intermediate arithmetic inside the cost model may use f64; anything stored or transmitted
//     may not.
//   - **Naming carries the distinction.** A field ending `_unix_ns` is an absolute instant. A
//     field ending `_ns` alone is a duration, an interval or a timeout. Scenario configuration
//     uses `_offset_ns` for times relative to the start of a run, because an offset is far
//     easier to author by hand than an epoch value.
//
// Replica clocks are synchronised by default, so a consumer computes staleness by plain
// subtraction. `Health` and `ReplicaState.clock_skew_ns` in telemetry.proto allow deliberate
// skew, because real fleets are not perfectly synchronised and skew corrupts exactly the
// staleness estimate a delay-compensating controller depends on.

// ---------------------------------------------------------------------------
// Identifiers
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Service classes
// ---------------------------------------------------------------------------

// Latency expectations differ by an order of magnitude between interactive and batch
// traffic, and the optimal policy differs with them. Treating all traffic as one class
// hides the head-of-line blocking that mixed classes cause.
enum SloClass {
  SLO_CLASS_UNSPECIFIED = 0;
  // Human waiting on a token stream. Cares about time-to-first-token and inter-token
  // latency. Reference targets: TTFT under 500 ms, ITL under 50 ms.
  SLO_CLASS_INTERACTIVE = 1;
  // Machine consumer, e.g. an agent step. Cares about end-to-end latency, tolerates
  // worse inter-token latency because nobody is reading the stream.
  SLO_CLASS_AGENT = 2;
  // Throughput work. Deadline in minutes or hours. Exists to be preempted.
  SLO_CLASS_BATCH = 3;
}

// The two phases have opposite resource profiles: prefill is compute-bound, decode is
// memory-bandwidth-bound. See docs/llm-serving-primer.md section 1.
enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_QUEUED = 1;
  PHASE_PREFILL = 2;
  PHASE_DECODE = 3;
  PHASE_PREEMPTED = 4;
  PHASE_DONE = 5;
}

// Where a sequence's KV cache currently lives. Only TIER_HBM can decode; every other tier
// is a place to park it, and moving between tiers costs shared bandwidth.
// See docs/ARCHITECTURE.md 7.2.
enum MemoryTier {
  MEMORY_TIER_UNSPECIFIED = 0;
  MEMORY_TIER_HBM = 1;   // on the replica's GPUs
  MEMORY_TIER_DRAM = 2;  // cluster-pooled host DRAM; local and remote are within ~20%
  MEMORY_TIER_SSD = 3;   // cluster-pooled NVMe
  MEMORY_TIER_NONE = 4;  // discarded; resuming requires recomputing prefill
}

// ---------------------------------------------------------------------------
// Outcomes
// ---------------------------------------------------------------------------

// Distinguishing these is the whole point of measuring goodput. A request that was
// rejected fast is a very different outcome from one that consumed 30 seconds of GPU time
// and then timed out, even though both are failures to the caller.
// The distinction that earns its place here is *when* a failure happened, because shedding early
// is cheap and failing late has already burned GPU time. Who shed it is a counter, not an outcome.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_OK = 1;                // completed within its SLO
  OUTCOME_OK_SLO_VIOLATED = 2;   // completed late: costs capacity, earns no goodput
  OUTCOME_REJECTED = 3;          // shed before consuming GPU time; the cheap failure
  OUTCOME_TIMEOUT_QUEUED = 4;    // deadline passed before admission
  OUTCOME_TIMEOUT_RUNNING = 5;   // deadline passed after consuming GPU time; the expensive failure
  OUTCOME_CANCELLED = 6;         // client gave up
  OUTCOME_FAILED = 7;            // replica died, or the engine shed it under KV pressure
}

// ---------------------------------------------------------------------------
// Health
// ---------------------------------------------------------------------------

// Health is a vector, not a boolean. The failure mode that breaks real fleets is a replica
// that reports healthy while serving at a tenth of its speed, because load balancers keep
// sending it work. See docs/ARCHITECTURE.md 6.3.
message Health {
  enum Announced {
    ANNOUNCED_UNSPECIFIED = 0;
    ANNOUNCED_HEALTHY = 1;
    ANNOUNCED_DRAINING = 2;   // cleanly announced shutdown
    ANNOUNCED_DOWN = 3;
  }
  Announced announced = 1;

  // Ground truth, visible to the simulator and to nobody else. A policy can only infer it.
  // 1.0 is nominal; 0.1 is a thermal or degraded-interconnect straggler.
  double true_speed_multiplier = 2;

  // Accepts work and never completes it: partial deadlock, or a network partition on the
  // response path. Indistinguishable from "very slow" to an observer, which is the point.
  bool accept_but_stall = 3;

  // Telemetry itself can fail independently of serving.
  enum TelemetryState {
    TELEMETRY_STATE_UNSPECIFIED = 0;
    TELEMETRY_STATE_FRESH = 1;
    TELEMETRY_STATE_FROZEN = 2;  // still publishing, values no longer updating
    TELEMETRY_STATE_SILENT = 3;
  }
  TelemetryState telemetry_state = 4;
}
